            exit 1
          }

      - name: Pasang Gradle sesuai gradle-wrapper.properties
        run: |
          set -eu
          URL=$(grep '^distributionUrl=' "$ROOT/gradle/wrapper/gradle-wrapper.properties" | head -n 1 | cut -d= -f2- | tr -d '\\\r')
          [ -n "$URL" ] || URL="https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"
          echo "Mengunduh Gradle dari: $URL"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gradle.zip" "$URL"
          mkdir -p "$RUNNER_TEMP/gradle-dist"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle-dist"
          GDIR=$(find "$RUNNER_TEMP/gradle-dist" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          echo "$GDIR/bin" >> "$GITHUB_PATH"

      - name: Terima lisensi Android SDK
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true

      - name: Build APK (debug)
        run: |
          set -eu
          cd "$ROOT"
          gradle --version
          gradle assembleDebug --no-daemon --console=plain --stacktrace

      - name: Siapkan SnapGrab.apk
        run: |
          set -eu
          APK=$(find "$ROOT/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan setelah build."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/SnapGrab.apk
          ls -lh dist/SnapGrab.apk
          {
            echo "### APK selesai dibuat"
            echo "Ambil **SnapGrab.apk** di tab **Releases** repo ini, atau di bagian **Artifacts** halaman ini."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Simpan sebagai Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SnapGrab-APK
          path: dist/SnapGrab.apk
          retention-days: 30

      - name: Publish ke Releases (biar bisa langsung download .apk)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FIXED: ${{ inputs.fix_permissions == true && 'ya' || 'tidak' }}
        run: |
          set -eu
          gh release create "apk-${{ github.run_number }}" dist/SnapGrab.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "SnapGrab APK #${{ github.run_number }}" \
            --notes "APK debug dibangun otomatis dari snapgrab.zip. Izin manifest dibetulkan: $FIXED."
            
