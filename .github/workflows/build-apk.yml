# =====================================================================
# BUILD SNAPGRAB APK DI CLOUD (GitHub Actions), dari snapgrab.zip ASLI
#
# 1. Simpan file ini di repo GitHub kamu dengan path:
#       .github/workflows/build-apk.yml
# 2. Upload snapgrab.zip (TANPA diubah) ke root repo yang sama.
# 3. Tunggu tab "Actions" jadi hijau, lalu ambil SnapGrab.apk di "Releases".
#
# Kode di dalam zip TIDAK diubah, kecuali kamu sendiri menjalankan workflow
# ini secara manual (Actions > Run workflow) dan mencentang "fix_permissions".
# =====================================================================
name: Build SnapGrab APK

on:
  push:
    paths:
      - "snapgrab.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      fix_permissions:
        description: "Betulkan nama izin di AndroidManifest (android.intent.permission.* jadi android.permission.*) supaya app punya akses internet"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Ambil repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Pasang Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Ekstrak snapgrab.zip
        run: |
          set -eu
          if [ ! -f snapgrab.zip ]; then
            echo "::error::snapgrab.zip belum ada di root repo. Upload dulu file zip-nya."
            exit 1
          fi
          mkdir -p work
          unzip -q -o snapgrab.zip -d work
          SETTINGS=$(find work -maxdepth 3 -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path "*/__MACOSX/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan di dalam zip."
            exit 1
          fi
          ROOT=$(cd "$(dirname "$SETTINGS")" && pwd)
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Betulkan izin manifest (opsional)
        if: ${{ inputs.fix_permissions == true }}
        run: |
          set -eu
          M="$ROOT/app/src/main/AndroidManifest.xml"
          sed -i 's/android\.intent\.permission\./android.permission./g' "$M"
          grep -n "uses-permission" "$M"

